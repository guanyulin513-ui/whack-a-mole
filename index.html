<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>點到星星就贏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="title">點到星星就贏</h1>
      <div class="hud">
        <div class="timer" aria-live="polite">
          剩餘時間：<span id="timeLeft">60</span>s
        </div>
        <button id="btnRestart" class="btn" type="button">重新開始</button>
      </div>
    </header>

    <section class="instructions" id="instructions">
      <p>說明：點到星星就贏了。</p>
      <p class="sub">（點到空白不會有事。遊戲時間 60 秒。）</p>
    </section>

    <section class="stage-wrap">
      <div id="stage" class="stage" role="application" aria-label="遊戲區域">
        <!-- 星星由 game.js 產生 -->
      </div>
    </section>

    <footer class="footer">
      <span id="statusText">準備開始！</span>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
